[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-data-analyzer"
version = "0.1.0"
description = "Comprehensive battery electrochemical data analysis toolkit"
authors = [{name = "Battery Research Lab"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "polars>=0.20.0",
    "pandas>=2.0.0", 
    "numpy>=1.24.0",
    "panel>=1.3.0",
    "param>=2.0.0",
    "bokeh>=3.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0", 
    "ipykernel>=6.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"